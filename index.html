<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>골프 동아리 출석</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1ec; --surface:#ffffff; --ink:#14201a; --muted:#6a766f; --line:#d7ddd5;
  --accent:#1f5a3c; --accent-ink:#ffffff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1512; --surface:#18201b; --ink:#e8efe9; --muted:#93a198; --line:#2a352e;
    --accent:#6fcf97; --accent-ink:#0b1a11;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#18201b; --ink:#e8efe9; --muted:#93a198; --line:#2a352e;
  --accent:#6fcf97; --accent-ink:#0b1a11;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  line-height:1.6; min-height:100vh;
}
.wrap{max-width:720px; margin:0 auto; padding:0 20px}
header{display:flex; align-items:baseline; justify-content:space-between; padding:22px 0; border-bottom:1px solid var(--line)}
.logo{font-weight:700; font-size:20px; letter-spacing:-0.02em}
nav a{color:var(--muted); text-decoration:none; font-size:14px; margin-left:18px}
nav a.on{color:var(--ink); font-weight:500}
h1{font-size:28px; font-weight:700; letter-spacing:-0.03em; margin:36px 0 6px}
.sub{color:var(--muted); font-size:15px; margin:0 0 20px}

.session{display:flex; flex-direction:column; gap:2px; padding:14px 16px; margin-bottom:20px;
  background:var(--surface); border:1px solid var(--line); border-radius:10px}
.session b{font-size:18px; font-weight:700}
.session span{font-size:13px; color:var(--muted)}

.me{display:flex; align-items:baseline; gap:12px; margin-bottom:18px; font-size:16px}
.me b{font-size:20px; font-weight:700}
.link{font:inherit; font-size:13px; color:var(--muted); background:none; border:0; padding:0; cursor:pointer; text-decoration:underline}
.join{display:grid; gap:8px; margin-bottom:22px}
.join label{font-size:15px; font-weight:500}
.join-row{display:flex; gap:8px}
.join input{
  font:inherit; font-size:16px; flex:1; min-width:0; padding:12px 14px; border-radius:10px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
}
[hidden]{display:none !important}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ---------- the ball box (dozen box feel: white shell, black band, black tray) ---------- */
.box{
  background:#f5f5f2; border:1px solid #d6d6d0; border-radius:12px; overflow:hidden; max-width:460px;
  box-shadow:0 18px 40px -22px rgba(0,0,0,.55);
}
.box-top{display:flex; align-items:center; justify-content:space-between; gap:12px;
  background:#0d0e0e; color:#fff; padding:13px 16px}
.box-top .owner{font-weight:700; font-size:16px}
.box-top .count{font-size:14px; color:#b9c0bb}
.box-top .count b{color:#fff; font-size:22px; font-weight:900; margin-right:2px}
.tray{
  background:#16181a; margin:14px 14px 10px; border-radius:8px; padding:12px;
  display:grid; grid-template-columns:repeat(3,1fr); gap:12px;
  box-shadow:inset 0 2px 10px rgba(0,0,0,.7);
}
.box-foot{display:flex; justify-content:space-between; padding:0 16px 13px; font-size:13px; color:#585e5a}
.box-foot i{font-weight:800; font-style:italic; color:#0d0e0e}
.slot{
  aspect-ratio:1; border-radius:50%; position:relative;
  background:radial-gradient(circle at 50% 60%, #000 0, #0a0b0b 70%);
  box-shadow:inset 0 3px 8px rgba(0,0,0,.85), 0 1px 0 rgba(255,255,255,.06);
}
.ball{
  position:absolute; inset:5%; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  color:#101111; text-align:center; line-height:1.05; user-select:none;
  box-shadow:0 5px 9px rgba(0,0,0,.55), inset -3px -4px 7px rgba(0,0,0,.2);
}
.ball.w{
  background:
    radial-gradient(circle at 50% 50%, rgba(0,0,0,.09) 0 1.1px, transparent 1.5px) 0 0/7px 7px,
    radial-gradient(circle at 32% 26%, #ffffff 0, #f1f3f1 45%, #c9d0cb 100%);
}
.ball.g{
  background:
    radial-gradient(circle at 50% 50%, rgba(0,0,0,.10) 0 1.1px, transparent 1.5px) 0 0/7px 7px,
    radial-gradient(circle at 32% 26%, #f5ffc4 0, #cfef43 45%, #98c01c 100%);
}
.print{transform:rotate(-8deg); max-width:96%}
.print .k{display:block; font-style:italic; font-weight:800; font-size:var(--ns); letter-spacing:0}
.print .n{display:block; font-weight:800; font-size:var(--ns); white-space:nowrap}
/* KAIST and the name share one size; it scales with the ball so both lines always fit */
.ball{container-type:inline-size}
.len2,.len3{--ns:19cqw}
.len4{--ns:17cqw}
.len5{--ns:14cqw}
.ball.drop{animation:drop .65s cubic-bezier(.3,1.5,.5,1) both}
@keyframes drop{
  0%{transform:translateY(-120%) scale(1.15); opacity:0}
  35%{opacity:1}
  100%{transform:translateY(0) scale(1)}
}
.ball.out{animation:out .3s ease-in both}
@keyframes out{to{transform:translateY(-90%) scale(1.1); opacity:0}}

.dates{font-size:13px; color:var(--muted); margin:12px 2px 0}
.actions{display:flex; gap:10px; margin-top:18px; align-items:center; flex-wrap:wrap}
.btn{
  font:inherit; font-weight:500; font-size:16px; padding:13px 26px; border-radius:10px; cursor:pointer;
  background:var(--accent); color:var(--accent-ink); border:0;
}
.btn:disabled{opacity:.4; cursor:not-allowed}
.btn.ghost{background:transparent; color:var(--muted); border:1px solid var(--line); font-size:14px; padding:11px 16px}
.msg{font-size:14px; color:var(--muted); min-height:22px; margin:12px 0 0}

.admin{margin-top:36px; border-top:1px solid var(--line); padding-top:18px}
.admin summary{cursor:pointer; font-weight:500; font-size:15px}
.admin-body{display:grid; gap:12px; margin-top:14px}
.admin-body label{display:grid; gap:4px; font-size:13px; color:var(--muted)}
.admin-body input{
  font:inherit; font-size:15px; padding:10px 12px; border-radius:10px; min-width:0;
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
}
.qr{display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap}
.qr-img{background:#fff; padding:12px; border-radius:10px; border:1px solid var(--line); line-height:0; min-width:60px; min-height:60px}
.qr-img img,.qr-img canvas{max-width:100%; height:auto}
.qr-info{flex:1; min-width:180px; font-size:13px; color:var(--muted); word-break:break-all}
.qr-info b{display:block; color:var(--ink); font-size:15px; margin-bottom:4px}

footer{color:var(--muted); font-size:13px; padding:40px 0 32px}
@media (prefers-reduced-motion: reduce){ .ball.drop,.ball.out{animation:none} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="logo">Golf Club.</span>
    <nav><a class="on" href="#">출석</a><a href="#">공지사항</a></nav>
  </header>

  <main>
    <h1>출석</h1>
    <p class="sub">출석할 때마다 이름이 적힌 공이 한 알씩 담겨요. 12알을 채우면 한 박스 완성!</p>

    <div class="session">
      <span>모임 날짜</span>
      <b id="sdate"></b>
      <span id="snote"></span>
    </div>

    <form class="join" id="joinForm" hidden>
      <label for="nameInput">처음 한 번만 이름을 입력해 주세요</label>
      <div class="join-row">
        <input id="nameInput" maxlength="6" placeholder="이름 (예: 홍길동)" autocomplete="off" list="memberList">
        <button class="btn" type="submit">시작하기</button>
      </div>
      <datalist id="memberList"></datalist>
    </form>

    <div id="board" hidden>
    <div class="me">
      <span><b id="meName"></b>님</span>
      <button class="link" type="button" id="changeMe">내 이름이 아니에요</button>
    </div>

    <section class="box" aria-live="polite">
      <div class="box-top">
        <span class="owner" id="owner"></span>
        <span class="count"><b id="num">0</b> / 12회</span>
      </div>
      <div class="tray" id="tray"></div>
      <div class="box-foot"><i>KAIST Golf</i><span>한 다스 · 12구</span></div>
    </section>
    <p class="dates" id="dates"></p>

    <div class="actions">
      <button class="btn" id="check">출석하기</button>
      <button class="btn ghost" id="undo">이 날짜 출석 취소</button>
    </div>
    </div>
    <p class="msg" id="msg"></p>

    <details class="admin" id="admin" hidden>
      <summary>운영자: 모임 QR 만들기</summary>
      <div class="admin-body">
        <p class="msg" style="margin:0">전체 출석 현황은 구글 시트의 '출석' 탭에서 확인하세요.</p>
        <label>모임 날짜
          <input type="date" id="qrDate">
        </label>
        <label>출석 페이지 주소 (배포한 사이트 주소를 붙여넣으세요)
          <input type="url" id="qrBase" placeholder="https://내사이트.vercel.app">
        </label>
        <div class="qr">
          <div class="qr-img" id="qrBox"></div>
          <div class="qr-info"><b id="qrTitle"></b><span id="qrLink"></span></div>
        </div>
      </div>
    </details>
  </main>

  <footer>© 2027 Golf Club.</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
  var API = "https://script.google.com/macros/s/AKfycbwLpWSxg2iZsrqmytKypj9JA7eFVliFrrl3O3OTsvz1zRvMyzz34hVRhPqHWwzdc7nx/exec";
  var ME_KEY = "golf-me";
  var MAX = 12, WHITE_UNTIL = 6;

  function pad(n){ return n < 10 ? "0" + n : "" + n; }
  function iso(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
  function validDate(s){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
    var p = s.split("-"), d = new Date(+p[0], +p[1]-1, +p[2]);
    return d.getFullYear() == +p[0] && d.getMonth() == +p[1]-1 && d.getDate() == +p[2];
  }
  function kdate(s){
    var p = s.split("-"), d = new Date(+p[0], +p[1]-1, +p[2]);
    return p[0] + "년 " + (+p[1]) + "월 " + (+p[2]) + "일 (" + ["일","월","화","수","목","금","토"][d.getDay()] + ")";
  }
  function md(s){ var p = s.split("-"); return (+p[1]) + "/" + (+p[2]); }

  var me = "";
  try{ me = localStorage.getItem(ME_KEY) || ""; }catch(e){}
  function saveMe(){ try{ if(me) localStorage.setItem(ME_KEY, me); else localStorage.removeItem(ME_KEY); }catch(e){} }

  var members = [], records = [], myDates = [];
  var loaded = false, busy = false;

  var fromQR = false;
  function readSession(){
    var h = "";
    try{ h = (location.hash || "").replace("#",""); }catch(e){}
    if(validDate(h)){ fromQR = true; return h; }
    fromQR = false; return iso(new Date());
  }
  var sessionDate = readSession();

  var $ = function(id){ return document.getElementById(id); };
  var tray = $("tray"), owner = $("owner"), num = $("num"), msg = $("msg"),
      checkBtn = $("check"), undoBtn = $("undo"), datesEl = $("dates"),
      joinForm = $("joinForm"), nameInput = $("nameInput"), board = $("board");

  function ballEl(name, idx, date){
    var b = document.createElement("div");
    var len = Math.max(2, Math.min(5, name.length));
    b.className = "ball " + (idx < WHITE_UNTIL ? "w" : "g") + " len" + len;
    var p = document.createElement("div"); p.className = "print";
    var k = document.createElement("span"); k.className = "k"; k.textContent = "KAIST";
    var n = document.createElement("span"); n.className = "n"; n.textContent = name;
    p.appendChild(k); p.appendChild(n); b.appendChild(p);
    b.title = (idx+1) + "회차 · " + date;
    return b;
  }

  function computeMine(){
    var seen = {};
    myDates = records.filter(function(r){
      if(r.name !== me || !validDate(r.date) || seen[r.date]) return false;
      return (seen[r.date] = true);
    }).map(function(r){ return r.date; }).sort();
  }

  function load(){
    return fetch(API, { cache:"no-store" })
      .then(function(r){ return r.json(); })
      .then(function(data){
        if(!data || !data.ok) throw new Error("bad");
        members = data.members || [];
        records = data.records || [];
        var dl = $("memberList"); dl.innerHTML = "";
        members.forEach(function(n){ var o = document.createElement("option"); o.value = n; dl.appendChild(o); });
        loaded = true; computeMine(); render();
      })
      .catch(function(){
        loaded = false; render();
        msg.textContent = "출석 기록을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.";
      });
  }

  function send(action){
    return fetch(API, {
      method:"POST",
      headers:{ "Content-Type":"text/plain;charset=utf-8" },
      body: JSON.stringify({ action:action, date:sessionDate, name:me })
    }).then(function(r){ return r.json(); });
  }

  function render(animIdx){
    $("sdate").textContent = kdate(sessionDate);
    $("snote").textContent = fromQR ? "QR로 정해진 모임 날짜예요" : "오늘 날짜예요. 모임 QR로 접속하면 그 날짜로 바뀌어요";
    joinForm.hidden = !!me;
    board.hidden = !me;
    if(!me) return;
    $("meName").textContent = me;
    owner.textContent = me + "의 볼 박스";
    var shown = myDates.slice(0, MAX);
    num.textContent = shown.length;
    tray.innerHTML = "";
    for(var i = 0; i < MAX; i++){
      var slot = document.createElement("div"); slot.className = "slot";
      if(i < shown.length){
        var b = ballEl(me, i, shown[i]);
        if(i === animIdx) b.classList.add("drop");
        slot.appendChild(b);
      }
      tray.appendChild(slot);
    }
    var attended = myDates.indexOf(sessionDate) >= 0, full = myDates.length >= MAX;
    checkBtn.disabled = !loaded || busy || attended || full;
    checkBtn.textContent = !loaded ? "불러오는 중…" : busy ? "저장 중…" : attended ? "출석 완료" : full ? "12알 완성" : "출석하기";
    undoBtn.disabled = !loaded || busy || !attended;
    datesEl.textContent = !loaded ? "" : myDates.length ? "출석한 날  " + myDates.map(md).join(", ") : "아직 출석 기록이 없어요";
  }

  function failMsg(res){
    if(res && res.error === "not_member") return "회원 명단에 없는 이름이에요. 이름을 확인하거나 운영자에게 문의해 주세요.";
    return "저장하지 못했어요. 잠시 후 다시 눌러 주세요.";
  }

  checkBtn.onclick = function(){
    if(busy || myDates.indexOf(sessionDate) >= 0 || myDates.length >= MAX) return;
    busy = true; msg.textContent = ""; render();
    send("check").then(function(res){
      busy = false;
      if(!res || !res.ok){ msg.textContent = failMsg(res); render(); return; }
      records.push({ date:sessionDate, name:me }); computeMine();
      render(myDates.indexOf(sessionDate));
      msg.textContent = myDates.length >= MAX ? me + "님, 12알을 모두 채웠어요. 한 박스 완성!" : me + "님 " + myDates.length + "회차 출석 완료";
    }).catch(function(){ busy = false; render(); msg.textContent = failMsg(); });
  };

  undoBtn.onclick = function(){
    var idx = myDates.indexOf(sessionDate);
    if(busy || idx < 0) return;
    busy = true; msg.textContent = ""; render();
    send("undo").then(function(res){
      busy = false;
      if(!res || !res.ok){ msg.textContent = failMsg(res); render(); return; }
      records = records.filter(function(r){ return !(r.name === me && r.date === sessionDate); });
      computeMine();
      var balls = tray.querySelectorAll(".ball");
      if(balls[idx]){ balls[idx].classList.add("out"); setTimeout(function(){ render(); }, 280); }
      else render();
      msg.textContent = me + "님 " + md(sessionDate) + " 출석을 취소했어요";
    }).catch(function(){ busy = false; render(); msg.textContent = failMsg(); });
  };

  joinForm.addEventListener("submit", function(e){
    e.preventDefault();
    var name = nameInput.value.replace(/\s+/g, "");
    if(!name){ nameInput.focus(); return; }
    if(members.length && members.indexOf(name) < 0){
      msg.textContent = "회원 명단에 없는 이름이에요. 이름을 다시 확인해 주세요."; return;
    }
    me = name; saveMe(); computeMine(); msg.textContent = ""; render();
  });

  $("changeMe").onclick = function(){
    nameInput.value = ""; me = ""; saveMe(); msg.textContent = ""; render(); nameInput.focus();
  };

  /* ---------- QR ---------- */
  // 운영자 메뉴는 주소 끝에 ?admin 을 붙여서 들어올 때만 보여요
  if(/[?&]admin(=|&|$)/.test(location.search)) $("admin").hidden = false;
  var qrDate = $("qrDate"), qrBase = $("qrBase");
  qrDate.value = sessionDate;
  try{
    var href = location.origin + location.pathname;
    if(/^https?:\/\//.test(href)) qrBase.value = href;
  }catch(e){}

  function makeQR(){
    var box = $("qrBox");
    box.innerHTML = "";
    var d = qrDate.value, base = qrBase.value.trim().split("#")[0];
    if(!validDate(d)){ $("qrTitle").textContent = "모임 날짜를 선택해 주세요"; $("qrLink").textContent = ""; return; }
    if(!/^https?:\/\//.test(base)){ $("qrTitle").textContent = "페이지 주소를 입력해 주세요"; $("qrLink").textContent = "https://로 시작하는 주소가 필요해요"; return; }
    var url = base + "#" + d;
    $("qrTitle").textContent = kdate(d) + " 모임";
    $("qrLink").textContent = url;
    if(typeof QRCode === "undefined"){ $("qrTitle").textContent = "QR 라이브러리를 불러오지 못했어요"; return; }
    new QRCode(box, { text:url, width:200, height:200, colorDark:"#000000", colorLight:"#ffffff", correctLevel:QRCode.CorrectLevel.M });
  }
  qrDate.addEventListener("input", makeQR);
  qrBase.addEventListener("input", makeQR);
  $("admin").addEventListener("toggle", function(){ if($("admin").open) makeQR(); });

  window.addEventListener("hashchange", function(){ sessionDate = readSession(); qrDate.value = sessionDate; msg.textContent = ""; render(); });

  render();
  load();
})();
</script>
</body>
</html>
